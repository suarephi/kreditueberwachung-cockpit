[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kreditueberwachung-mock"
version = "0.1.0"
description = "Mock Swiss mortgage credit-monitoring dataset (100k clients) with Fahrlaender-style valuation, event-based surveillance, and stress-test overlay."
requires-python = ">=3.9"
dependencies = [
  "faker>=20",
  "numpy>=1.24",
  "pandas>=2.0",
  "python-stdnum>=1.19",
  "pydantic>=2.0",
  "tqdm>=4.65",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
